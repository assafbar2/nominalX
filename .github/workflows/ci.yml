name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, Build, Unit & E2E Tests (core, cli, web)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck workspace (core, cli, web)
        run: pnpm typecheck

      - name: Build workspace (core, cli, web)
        run: pnpm build

      - name: Verify static web bundle output
        run: test -f packages/web/dist/index.html

      - name: Run unit & E2E tests
        run: pnpm test
