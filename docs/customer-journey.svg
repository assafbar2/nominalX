  <g transform="translate(234, 114)">
    <rect width="206" height="218" rx="14" fill="#131E34" stroke="#38BDF8" stroke-width="2" />
    <rect width="206" height="5" rx="2.5" fill="#EF4444" />
    <text x="16" y="32" fill="#7DD3FC" font-family="ui-monospace, monospace" font-size="11" font-weight="800">SPRINT 1 · HANDOFF</text>
    <text x="16" y="61" fill="#F8FAFC" font-family="ui-monospace, monospace" font-size="22" font-weight="800">GATE 1</text>
    <rect x="104" y="42" width="88" height="22" rx="6" fill="#EF4444" fill-opacity="0.18" stroke="#EF4444" stroke-opacity="0.6" />
    <text x="148" y="57" text-anchor="middle" fill="#FCA5A5" font-family="ui-monospace, monospace" font-size="9.5" font-weight="800">HARD STOPS</text>
    <text x="16" y="88" fill="#F8FAFC" font-family="-apple-system, sans-serif" font-size="14.5" font-weight="800">Flight Check</text>
    <text x="16" y="108" fill="#38BDF8" font-family="ui-monospace, monospace" font-size="12" font-weight="800">Setup Check (1–6/6)</text>
    <text x="16" y="132" fill="#CBD5E1" font-family="-apple-system, sans-serif" font-size="11.5">Sales-to-FDE Handoff</text>
    <text x="16" y="150" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="10.5">Sold vs. Staging Telemetry</text>
