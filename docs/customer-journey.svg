    <text x="16" y="61" fill="#F8FAFC" font-family="ui-monospace, monospace" font-size="22" font-weight="800">GATE 2</text>
    <rect x="104" y="42" width="88" height="22" rx="6" fill="#22C55E" fill-opacity="0.16" stroke="#22C55E" stroke-opacity="0.6" />
    <text x="148" y="57" text-anchor="middle" fill="#86EFAC" font-family="ui-monospace, monospace" font-size="9.5" font-weight="800">0.0% · GR A</text>
    <text x="16" y="88" fill="#F8FAFC" font-family="-apple-system, sans-serif" font-size="14.5" font-weight="800">Static Fire</text>
    <text x="16" y="108" fill="#38BDF8" font-family="ui-monospace, monospace" font-size="12" font-weight="800">Fault Injection (1–7/7)</text>
    <text x="16" y="132" fill="#CBD5E1" font-family="-apple-system, sans-serif" font-size="11.5">Integration &amp; Cutover</text>
    <text x="16" y="150" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="10.5">Fix &amp; Re-Run to 0.0% Loss</text>
    <line x1="16" y1="166" x2="190" y2="166" stroke="#1E293B" />
    <text x="16" y="185" fill="#CBD5E1" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700">OWNER: LEAD FDE</text>
    <!-- 7 LED pips -->
    <rect x="16" y="196" width="20" height="7" rx="3.5" fill="#22C55E" />
    <rect x="41" y="196" width="20" height="7" rx="3.5" fill="#22C55E" />
    <rect x="66" y="196" width="20" height="7" rx="3.5" fill="#22C55E" />
    <rect x="91" y="196" width="20" height="7" rx="3.5" fill="#22C55E" />
    <rect x="116" y="196" width="20" height="7" rx="3.5" fill="#22C55E" />
    <rect x="141" y="196" width="20" height="7" rx="3.5" fill="#22C55E" />
    <rect x="166" y="196" width="24" height="7" rx="3.5" fill="#22C55E" />
  </g>

  <!-- GATE 3: CREW DRILL · LIVE INCIDENT DRILL + HANDOVER -->
  <g transform="translate(674, 114)">
    <rect width="206" height="218" rx="14" fill="#131E34" stroke="#38BDF8" stroke-width="2" />
    <rect width="206" height="5" rx="2.5" fill="#22C55E" />
    <text x="16" y="32" fill="#7DD3FC" font-family="ui-monospace, monospace" font-size="11" font-weight="800">SPRINT 3 · HANDOVER</text>
    <text x="16" y="61" fill="#F8FAFC" font-family="ui-monospace, monospace" font-size="22" font-weight="800">GATE 3</text>
    <rect x="104" y="42" width="88" height="22" rx="6" fill="#38BDF8" fill-opacity="0.16" stroke="#38BDF8" stroke-opacity="0.6" />
    <text x="148" y="57" text-anchor="middle" fill="#7DD3FC" font-family="ui-monospace, monospace" font-size="9.5" font-weight="800">90s + SHA256</text>
    <text x="16" y="88" fill="#F8FAFC" font-family="-apple-system, sans-serif" font-size="14.5" font-weight="800">Crew Drill</text>
    <text x="16" y="108" fill="#38BDF8" font-family="ui-monospace, monospace" font-size="12" font-weight="800">Live Incident Drill (1–3/3)</text>
    <text x="16" y="132" fill="#CBD5E1" font-family="-apple-system, sans-serif" font-size="11.5">Day-30 Enablement</text>
    <text x="16" y="150" fill="#86EFAC" font-family="ui-monospace, monospace" font-size="10.5">+ Signed Dossier &amp; Runbook</text>
    <line x1="16" y1="166" x2="190" y2="166" stroke="#1E293B" />
    <text x="16" y="185" fill="#CBD5E1" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700">OWNER: LEAD CSE + FDE</text>
    <!-- 3 alarms + seal -->
    <rect x="16" y="196" width="38" height="7" rx="3.5" fill="#22C55E" />
    <rect x="60" y="196" width="38" height="7" rx="3.5" fill="#22C55E" />
    <rect x="104" y="196" width="38" height="7" rx="3.5" fill="#22C55E" />
    <rect x="148" y="196" width="42" height="7" rx="3.5" fill="#38BDF8" />
  </g>

  <!-- RIGHT UNNUMBERED BOOKEND 1: SUPPORT -->
  <g transform="translate(910, 114)">
    <rect width="164" height="218" rx="14" fill="#0C1322" stroke="#334155" stroke-width="1.6" />
    <rect width="164" height="5" rx="2.5" fill="#64748B" />
    <text x="14" y="32" fill="#64748B" font-family="ui-monospace, monospace" font-size="10.5" font-weight="800">AFTER NOMINALX</text>
    <rect x="14" y="42" width="108" height="20" rx="6" fill="#1E293B" stroke="#334155" />
    <text x="68" y="55" text-anchor="middle" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="9.5" font-weight="800">LIVE OPERATIONS</text>
    <text x="14" y="94" fill="#F8FAFC" font-family="-apple-system, sans-serif" font-size="17" font-weight="800">Support</text>
    <text x="14" y="114" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="11.5">Production SLAs</text>
    <text x="14" y="140" fill="#86EFAC" font-family="ui-monospace, monospace" font-size="11" font-weight="700">Day-1 Runbook</text>
    <text x="14" y="156" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="11">&amp; Waiver Closure</text>
