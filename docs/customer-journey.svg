    <text x="14" y="188" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700">OWNER: SUPPORT ENG</text>
    <rect x="14" y="198" width="136" height="6" rx="3" fill="#22C55E" />
  </g>

  <!-- RIGHT UNNUMBERED BOOKEND 2: RENEWAL & EXPANSION -->
  <g transform="translate(1086, 114)">
    <rect width="164" height="218" rx="14" fill="#0C1322" stroke="#334155" stroke-width="1.6" />
    <rect width="164" height="5" rx="2.5" fill="#64748B" />
    <text x="14" y="32" fill="#64748B" font-family="ui-monospace, monospace" font-size="10.5" font-weight="800">AFTER NOMINALX</text>
    <rect x="14" y="42" width="114" height="20" rx="6" fill="#1E293B" stroke="#334155" />
    <text x="71" y="55" text-anchor="middle" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="9.5" font-weight="800">CUSTOMER GROWTH</text>
    <text x="14" y="92" fill="#F8FAFC" font-family="-apple-system, sans-serif" font-size="16" font-weight="800">Renewal &amp;</text>
    <text x="14" y="112" fill="#F8FAFC" font-family="-apple-system, sans-serif" font-size="16" font-weight="800">Expansion</text>
    <text x="14" y="140" fill="#7DD3FC" font-family="ui-monospace, monospace" font-size="11" font-weight="700">Longitudinal JSON</text>
    <text x="14" y="156" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="11">Expansion → Gate 1</text>
    <line x1="14" y1="170" x2="150" y2="170" stroke="#1E293B" />
    <text x="14" y="188" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700">OWNER: TAM + CSE</text>
    <rect x="14" y="198" width="136" height="6" rx="3" fill="#38BDF8" />
