  <!-- Bottom Footer Strip -->
  <text x="556" y="394" text-anchor="middle" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="12" font-weight="700">ONLY NUMBERED STAGES: GATE 1 · GATE 2 · GATE 3 · ONE ENGINE (@nominalx/core) · CLI + STATIC COCKPIT</text>
