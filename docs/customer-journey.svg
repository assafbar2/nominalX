<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-labelledby="title desc">
  <title id="title">NominalX Customer Engineering Journey: Deal Close, The In-Between Gap (Gate 1, Gate 2, Gate 3), Support, and Renewal &amp; Expansion</title>
  <desc id="desc">Customer engineering journey showing unnumbered Deal Close bookend, the highlighted in-between gap covered by NominalX (Gate 1 Flight Check Setup Check 1-6/6, Gate 2 Static Fire Fault Injection 1-7/7, Gate 3 Crew Drill Live Incident Drill 1-3/3 plus Signed Dossier), and unnumbered Support and Renewal and Expansion bookends.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14" />
      <stop offset="100%" stop-color="#0E1729" />
    </linearGradient>
    <linearGradient id="gapZone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.04" />
    </linearGradient>
    <linearGradient id="railGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748B" />
      <stop offset="22%" stop-color="#38BDF8" />
      <stop offset="72%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#22C55E" />
    </linearGradient>
  </defs>

  <!-- Outer Frame -->
  <rect x="0" y="0" width="1280" height="420" rx="20" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="2" />

  <!-- Subtle Header Strip -->
  <text x="36" y="40" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="800" letter-spacing="1.8">NOMINALX · CUSTOMER ENGINEERING JOURNEY (DEAL CLOSE → GATES 1–3 → SUPPORT &amp; RENEWAL)</text>
  <text x="36" y="62" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="600">Sales says the account is green. Nothing is nominal until telemetry proves it.</text>

  <!-- Legend Chips Top Right -->
  <rect x="850" y="24" width="128" height="28" rx="14" fill="#22C55E" fill-opacity="0.14" stroke="#22C55E" stroke-opacity="0.6" />
  <circle cx="868" cy="38" r="5" fill="#22C55E" />
  <text x="880" y="42" fill="#4ADE80" font-family="ui-monospace, monospace" font-size="11" font-weight="800">NOMINAL</text>

  <rect x="990" y="24" width="132" height="28" rx="14" fill="#EF4444" fill-opacity="0.15" stroke="#EF4444" stroke-opacity="0.6" />
  <circle cx="1008" cy="38" r="5" fill="#EF4444" />
  <text x="1020" y="42" fill="#F87171" font-family="ui-monospace, monospace" font-size="11" font-weight="800">HARD STOP</text>

  <rect x="1134" y="24" width="112" height="28" rx="14" fill="#F59E0B" fill-opacity="0.15" stroke="#F59E0B" stroke-opacity="0.6" />
  <circle cx="1152" cy="38" r="5" fill="#F59E0B" />
  <text x="1164" y="42" fill="#FBBF24" font-family="ui-monospace, monospace" font-size="11" font-weight="800">WAIVED</text>

  <!-- Highlighted In-Between Gap Enclosure (Gates 1 -> 3) -->
  <rect x="218" y="84" width="676" height="278" rx="18" fill="url(#gapZone)" stroke="#38BDF8" stroke-width="2" stroke-dasharray="7 5" />
  <rect x="296" y="72" width="520" height="24" rx="12" fill="#0B1324" stroke="#38BDF8" stroke-width="1.6" />
  <text x="556" y="88" text-anchor="middle" fill="#7DD3FC" font-family="ui-monospace, monospace" font-size="11" font-weight="800" letter-spacing="1.2">THE IN-BETWEEN GAP · NOMINALX LAUNCH READINESS (GATES 1 → 3)</text>

  <!-- Connecting Pipeline Conduit -->
  <line x1="115" y1="224" x2="1170" y2="224" stroke="url(#railGrad)" stroke-width="3.5" stroke-opacity="0.7" />

