  <g transform="translate(32, 114)">
    <rect width="168" height="218" rx="14" fill="#0C1322" stroke="#334155" stroke-width="1.6" />
    <rect width="168" height="5" rx="2.5" fill="#64748B" />
    <text x="16" y="32" fill="#64748B" font-family="ui-monospace, monospace" font-size="10.5" font-weight="800">BEFORE NOMINALX</text>
    <rect x="16" y="42" width="96" height="20" rx="6" fill="#1E293B" stroke="#334155" />
    <text x="64" y="55" text-anchor="middle" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="9.5" font-weight="800">CRM HANDOFF</text>
    <text x="16" y="94" fill="#F8FAFC" font-family="-apple-system, sans-serif" font-size="17" font-weight="800">Deal Close</text>
    <text x="16" y="114" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="11.5">Before Launch Readiness</text>
    <text x="16" y="140" fill="#7DD3FC" font-family="ui-monospace, monospace" font-size="11" font-weight="700">nominalx.yaml</text>
    <text x="16" y="156" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="11">Contract Seed</text>
    <line x1="16" y1="170" x2="152" y2="170" stroke="#1E293B" />
    <text x="16" y="188" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="10" font-weight="700">OWNER: LEAD SE / SA</text>
    <rect x="16" y="198" width="136" height="6" rx="3" fill="#22C55E" />
  </g>

